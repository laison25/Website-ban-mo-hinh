<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Đăng nhập Lzon Poke để lưu mô hình yêu thích và theo dõi đơn hàng.">
  <title>Lzon Poke · Tài khoản cửa hàng</title>
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main id="app" aria-busy="true"><p class="loading" role="status">Đang kiểm tra phiên đăng nhập…</p></main>

  <template id="auth-template">
    <div class="auth-layout">
      <picture class="login-visual">
        <source media="(max-width: 850px)" srcset="/shop-images/login-lzon-poke.webp">
        <img class="login-banner" src="/shop-images/login-lzon-poke-portrait.webp" alt="Lzon Poke · Mô hình sưu tầm" fetchpriority="high" decoding="async">
      </picture>
      <section class="auth-main" aria-labelledby="auth-title">
        <div class="auth-card">
          <a class="brand auth-brand" href="/" aria-label="Về cửa hàng Lzon Poke"><img class="brand-logo" src="/shop-images/logo.webp" width="40" height="40" alt="">Lzon Poke</a>
          <h1 id="auth-title" tabindex="-1"></h1>
          <p id="auth-intro" class="muted"></p>
          <p id="auth-notice" class="notice" aria-live="polite" hidden></p>
          <form id="auth-form" method="post">
            <label id="register-name" hidden>Họ và tên<input name="name" autocomplete="name" placeholder="Nguyễn Văn An" maxlength="80"></label>
            <label>Email<input type="email" name="email" autocomplete="username" placeholder="ten@example.com" maxlength="254" required></label>
            <label>Mật khẩu<span class="password-field"><input type="password" id="auth-password" name="password" required><button type="button" class="text-button reveal" aria-controls="auth-password" aria-pressed="false">Hiện</button></span><small id="password-hint" hidden>Dùng từ 15 đến 128 ký tự.</small></label>
            <button class="primary full" type="submit" id="auth-submit"></button>
          </form>
          <p class="auth-switch"><span id="switch-label"></span> <button type="button" class="text-button" id="auth-switch"></button></p>
        </div>
      </section>
    </div>
  </template>

  <template id="shell-template">
    <div class="dashboard">
      <aside class="sidebar">
        <a class="brand" href="/" aria-label="Về cửa hàng Lzon Poke"><img class="brand-logo" src="/shop-images/logo.webp" width="40" height="40" alt="">Lzon Poke</a>
        <nav id="navigation" aria-label="Điều hướng chính">
          <p class="overline" id="admin-label">QUẢN TRỊ</p>
          <button data-view="users" class="nav-button"><span aria-hidden="true">▦</span>Người dùng</button>
          <button data-view="audit" class="nav-button"><span aria-hidden="true">≡</span>Nhật ký hoạt động</button>
          <a id="shop-admin-link" class="nav-button" href="/shop-admin"><span aria-hidden="true">▤</span>Quản lý cửa hàng</a>
          <p class="overline">TÀI KHOẢN</p>
          <button data-view="overview" class="nav-button"><span aria-hidden="true">◈</span>Tổng quan</button>
          <button data-view="profile" class="nav-button"><span aria-hidden="true">◎</span>Hồ sơ cá nhân</button>
          <button data-view="sessions" class="nav-button"><span aria-hidden="true">▣</span>Phiên đăng nhập</button>
          <button data-view="activity" class="nav-button"><span aria-hidden="true">◷</span>Lịch sử bảo mật</button>
          <button data-view="password" class="nav-button"><span aria-hidden="true">◇</span>Đổi mật khẩu</button>
          <a class="nav-button" href="/orders"><span aria-hidden="true">▤</span>Đơn hàng của tôi</a>
          <a class="nav-button" href="/"><span aria-hidden="true">◈</span>Về cửa hàng</a>
        </nav>
        <button id="logout" class="nav-button logout"><span aria-hidden="true">↪</span>Đăng xuất</button>
      </aside>
      <div class="dash-main">
        <header class="dash-header"><span id="section-label"></span><div class="identity"><span class="avatar" id="identity-initial" aria-hidden="true"></span><div><strong id="identity-name"></strong><small id="identity-role"></small></div></div></header>
        <div class="content"><p id="dash-notice" class="notice" aria-live="polite" hidden></p><section id="view"></section></div>
      </div>
    </div>
  </template>

  <template id="overview-template">
    <header class="account-banner">
      <p class="overline">TỔNG QUAN TÀI KHOẢN</p>
      <h1 id="overview-greeting" tabindex="-1">Tổng quan</h1>
      <p id="overview-email"></p>
    </header>
    <div class="stats account-stats" aria-label="Tình trạng tài khoản">
      <div><span>Vai trò</span><strong id="overview-role"></strong></div>
      <div><span>Phiên đang hoạt động</span><strong id="overview-sessions">—</strong></div>
      <div><span>Truy cập gần nhất</span><strong id="overview-login">—</strong></div>
    </div>
    <div class="account-links">
      <button class="panel account-link" data-open="profile"><strong>Hồ sơ cá nhân</strong><span>Xem thông tin tài khoản và sửa tên hiển thị.</span></button>
      <button class="panel account-link" data-open="sessions"><strong>Phiên đăng nhập</strong><span>Xem và kết thúc các phiên đang hoạt động.</span></button>
      <button class="panel account-link" data-open="activity"><strong>Lịch sử bảo mật</strong><span>Xem các sự kiện gần đây của tài khoản.</span></button>
      <button class="panel account-link" data-open="password"><strong>Đổi mật khẩu</strong><span>Cập nhật mật khẩu và kết thúc các phiên cũ.</span></button>
    </div>
  </template>

  <template id="sessions-template">
    <div class="page-heading"><h1 tabindex="-1">Phiên đăng nhập</h1><p class="muted">Xem nơi tài khoản đang đăng nhập và kết thúc phiên bạn không còn dùng.</p></div>
    <div class="panel table-scroll"><table aria-label="Phiên đăng nhập"><thead><tr><th>Trình duyệt</th><th>Đăng nhập lúc</th><th>Hết hạn lúc</th><th>Thao tác</th></tr></thead><tbody id="session-rows"></tbody></table></div>
    <dialog id="revoke-dialog" aria-labelledby="revoke-title"><form id="revoke-form" method="post">
      <h2 id="revoke-title">Kết thúc phiên này?</h2>
      <p class="muted" id="revoke-summary"></p>
      <p id="revoke-notice" class="notice" aria-live="polite" hidden></p>
      <div class="actions"><button type="button" id="cancel-revoke" class="secondary">Hủy</button><button type="submit" class="primary">Kết thúc phiên</button></div>
    </form></dialog>
  </template>

  <template id="activity-template">
    <div class="page-heading"><h1 tabindex="-1">Lịch sử bảo mật</h1><p class="muted">30 sự kiện gần nhất liên quan đến tài khoản của bạn.</p></div>
    <div class="panel table-scroll"><table aria-label="Lịch sử bảo mật"><thead><tr><th>Sự kiện</th><th>Thời gian</th></tr></thead><tbody id="activity-rows"></tbody></table></div>
  </template>

  <template id="users-template">
    <div class="page-heading"><h1 tabindex="-1">Quản lý người dùng</h1><p class="muted">Tìm tài khoản, thay đổi vai trò và kiểm soát quyền truy cập.</p></div>
    <div class="stats" aria-label="Thống kê tài khoản">
      <div><span>Tổng tài khoản</span><strong id="stat-total">—</strong></div>
      <div><span>Đang hoạt động</span><strong id="stat-active">—</strong></div>
      <div><span>Quản trị viên</span><strong id="stat-admins">—</strong></div>
    </div>
    <div class="panel">
      <form id="filters" class="filters">
        <label>Tìm người dùng<input type="search" name="q" placeholder="Tên hoặc email" maxlength="100"></label>
        <label>Vai trò<select name="role"><option value="">Tất cả vai trò</option><option value="admin">Quản trị viên</option><option value="member">Thành viên</option></select></label>
        <label>Trạng thái<select name="status"><option value="">Tất cả trạng thái</option><option value="active">Hoạt động</option><option value="disabled">Đã khóa</option></select></label>
        <button type="submit" class="secondary">Lọc</button>
      </form>
      <div class="table-scroll"><table aria-label="Danh sách tài khoản"><thead><tr><th>Người dùng</th><th>Vai trò</th><th>Trạng thái</th><th>Ngày tạo</th><th>Thao tác</th></tr></thead><tbody id="users-rows"></tbody></table></div>
      <div class="pagination"><p id="results-count" aria-live="polite"></p><div><button class="secondary" id="previous">Trang trước</button><button class="secondary" id="next">Trang sau</button></div></div>
    </div>
    <dialog id="edit-dialog" aria-labelledby="edit-title"><form id="edit-form" method="post">
      <h2 id="edit-title">Cập nhật tài khoản</h2><p id="edit-email" class="muted"></p>
      <p id="edit-notice" class="notice" aria-live="polite" hidden></p>
      <label>Vai trò<select name="role"><option value="member">Thành viên</option><option value="admin">Quản trị viên</option></select></label>
      <label>Trạng thái<select name="active"><option value="true">Hoạt động</option><option value="false">Đã khóa</option></select></label>
      <p class="muted">Khi vai trò hoặc trạng thái thay đổi, các phiên của tài khoản sẽ kết thúc.</p>
      <div class="actions"><button type="button" class="secondary" id="cancel-edit">Hủy</button><button type="submit" class="primary">Lưu thay đổi</button></div>
    </form></dialog>
  </template>

  <template id="audit-template">
    <div class="page-heading"><h1 tabindex="-1">Nhật ký hoạt động</h1><p class="muted">50 sự kiện gần nhất liên quan đến xác thực và quản trị tài khoản.</p></div>
    <div class="panel table-scroll"><table aria-label="Nhật ký hoạt động"><thead><tr><th>Sự kiện</th><th>Người thực hiện</th><th>Tài khoản liên quan</th><th>Thời gian</th></tr></thead><tbody id="audit-rows"></tbody></table></div>
  </template>

  <template id="profile-template">
    <div class="page-heading"><h1 tabindex="-1">Hồ sơ cá nhân</h1><p class="muted">Xem thông tin tài khoản và cập nhật tên hiển thị.</p></div>
    <form class="panel settings" id="profile-form" method="post">
      <label>Họ và tên<input name="name" autocomplete="name" required minlength="2" maxlength="80"></label>
      <label>Email<input name="email" type="email" readonly></label>
      <label>Vai trò<input name="role" readonly></label>
      <div><button class="primary" type="submit">Lưu hồ sơ</button></div>
    </form>
  </template>

  <template id="password-template">
    <div class="page-heading"><h1 tabindex="-1">Đổi mật khẩu</h1><p class="muted">Sau khi lưu, bạn sẽ cần đăng nhập lại trên các thiết bị.</p></div>
    <form class="panel settings" id="password-form" method="post">
      <label>Mật khẩu hiện tại<input type="password" name="currentPassword" autocomplete="current-password" required></label>
      <label>Mật khẩu mới<input type="password" name="password" autocomplete="new-password" aria-describedby="new-password-hint" required><small id="new-password-hint">Dùng từ 15 đến 128 ký tự.</small></label>
      <label>Nhập lại mật khẩu mới<input type="password" name="confirmation" autocomplete="new-password" required></label>
      <div><button class="primary" type="submit">Đổi mật khẩu</button></div>
    </form>
  </template>
</body>
</html>
